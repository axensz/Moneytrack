# Sample workflow for building and deploying a Next.js site to GitHub Pages
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Validate and deploy Moneytrack

on:
  pull_request:
    branches: ["main"]

  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Read-only by default. Deployment jobs opt into Pages permissions below.
permissions:
  contents: read

# Serializa cada rama/despliegue sin bloquear PR independientes.
concurrency:
  # Un PR no bloquea la validación de otros PR. Push/workflow_dispatch de la
  # misma rama siguen serializados para proteger el despliegue de Pages.
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-deploy', github.workflow) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
      NEXT_PUBLIC_BASE_PATH: /Moneytrack
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci
      - name: Install backend (functions) dependencies
        run: npm --prefix functions ci
      - name: Backend audit (zero findings required)
        run: npm --prefix functions audit --audit-level=low
      - name: Backend lint
        run: npm --prefix functions run lint
      - name: Backend typecheck
        run: npm --prefix functions run typecheck
      - name: Backend unit tests
        run: npm --prefix functions test
      # Notification emulator contracts. The demo VAPID public key is generated
      # in its OWN step and written to $GITHUB_ENV; later steps consume it. The
      # private key stays only in functions/.secret.local (git-ignored) and is
      # never printed. This job validates only — it never deploys or reads
      # production secrets.
      - name: Prepare ephemeral demo VAPID config
        run: |
          npm --prefix functions run build
          npm --prefix functions run notifications:prepare-emulator -- --project demo-moneytrack --github-env "$GITHUB_ENV"
      # These contracts call the Firestore SDK directly; they do not invoke
      # deployed functions or require the Auth/Functions emulators.
      - name: Firestore rules and notification store integration
        timeout-minutes: 5
        run: npm run test:notifications:emulator
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests with coverage
        run: npm run test:coverage
      - name: Check diff integrity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --check
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$BASE_SHA" "$GITHUB_SHA"
          fi
      - name: Build with Next.js
        run: npx --no-install next build

  # Package only deployable events after the validation gate succeeds.
  build:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
      NEXT_PUBLIC_BASE_PATH: /Moneytrack
      # Web Push public key comes from a repository variable (not a secret): it
      # is embedded in the static client so the current device can subscribe.
      NEXT_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY }}
      # Gemini usa BYOK: cada usuario agrega su key en la app. No se inyecta en el build.
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate optional production Web Push public key
        run: |
          if [ -z "$NEXT_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY" ]; then
            echo "::notice::Web Push is not configured; publishing with Web Push disabled."
            exit 0
          fi
          # VAPID public keys are 65-byte base64url (87 chars, no padding).
          if ! printf '%s' "$NEXT_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY" | grep -Eq '^[A-Za-z0-9_-]{87}$'; then
            echo "::error::NEXT_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY is malformed (expected 87-char base64url)."
            exit 1
          fi
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Inject SW version
        run: node scripts/inject-sw-version.mjs
        env:
          BUILD_HASH: ${{ github.sha }}
      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.runner }} next build
      - name: Verify Web Push public key is embedded in the artifact
        if: ${{ env.NEXT_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY != '' }}
        run: |
          if ! grep -rqF "$NEXT_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY" ./out; then
            echo "::error::The Web Push public key was not embedded in the built artifact."
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  # Deployment job
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
