openapi: 3.1.0
info:
  title: MoneyTrack Ingest API
  version: 1.0.0
  description: >
    API de ingesta de transacciones de MoneyTrack. Permite subir un lote de
    gastos por HTTP y los convierte en candidatos de importacion (shortcut,
    schemaVersion 3) en estado `pending`. Vive en Cloud Functions (onRequest);
    no hay servidor Next en produccion. La autenticacion es por API key en el
    header `X-MoneyTrack-Api-Key`: el `uid` NUNCA viene del body, se resuelve
    desde la key. Los montos se envian en pesos (COP) y se convierten a minor
    units (x100). En Fase 1 un gasto sin cuenta resoluble no crea candidato
    (warning `account_not_found`).
servers:
  - url: https://us-central1-REGION.cloudfunctions.net
    description: Cloud Functions (reemplazar por el host real del proyecto)
paths:
  /ingestTransactions:
    post:
      operationId: ingestTransactions
      summary: Ingesta un lote de transacciones (gastos) como candidatos pendientes.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
      responses:
        '200':
          description: Lote procesado. Incluye resumen, candidatos creados y warnings por item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '400':
          description: Body malformado, clave desconocida, o 0 transacciones validas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: API key ausente o invalida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Mas de 100 transacciones en el lote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-MoneyTrack-Api-Key
      description: >
        API key del usuario. Se compara por su hash sha256 contra la coleccion
        global `apiKeys/`. El valor en claro solo se devuelve una vez al
        generarla; nunca se persiste en claro ni se loguea.
  schemas:
    IngestRequest:
      type: object
      additionalProperties: false
      required:
        - transactions
      properties:
        batch:
          $ref: '#/components/schemas/BatchMeta'
        transactions:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/IngestItem'
    BatchMeta:
      type: object
      additionalProperties: false
      description: Metadatos opcionales del lote. idempotencyKey se usa como batchId y para ids estables en reintentos.
      properties:
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
        source:
          type: string
          enum: [api]
        defaultCurrency:
          type: string
          enum: [COP]
    IngestItem:
      type: object
      additionalProperties: false
      required:
        - type
        - amount
        - merchant
        - occurredAt
      properties:
        type:
          type: string
          enum: [expense]
          description: Fase 1 solo soporta gastos. Otro valor produce warning unsupported_type.
        amount:
          type: number
          description: Monto en pesos (COP). Debe ser finito, >0 y <=1000000000. Se convierte a amountMinor = round(amount*100).
          exclusiveMinimum: 0
          maximum: 1000000000
        currency:
          type: string
          enum: [COP]
        merchant:
          type: string
          minLength: 1
          maxLength: 140
        occurredAt:
          type: string
          format: date-time
          description: Fecha/hora ISO 8601 del gasto.
        suggestedCategory:
          type: string
          minLength: 1
          maxLength: 100
          description: Si se omite, el candidato usa el default 'Sin categoria'.
        suggestedAccountName:
          type: string
          minLength: 1
          maxLength: 120
          description: Nombre de cuenta a resolver (match exacto unico, case-insensitive + trim). Sin match unico => warning account_not_found.
        externalId:
          type: string
          minLength: 1
          maxLength: 120
          description: Id externo para deduplicacion estable entre lotes.
        note:
          type: string
          maxLength: 500
    IngestResult:
      type: object
      additionalProperties: false
      required:
        - batchId
        - received
        - created
        - skipped
        - failed
        - candidates
        - warnings
      properties:
        batchId:
          type: string
          description: batch.idempotencyKey si se envio, si no un token aleatorio base64url.
        received:
          type: integer
          description: Numero de transacciones recibidas en el lote.
        created:
          type: integer
          description: Candidatos creados.
        skipped:
          type: integer
          description: Items omitidos por duplicado (candidato ya existente).
        failed:
          type: integer
          description: Items que fallaron (unsupported_type, invalid_item o account_not_found).
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/CandidateSummary'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
    CandidateSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - merchant
        - amountMinor
        - occurredAt
        - suggestedAccountId
        - suggestedCategory
        - status
      properties:
        id:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: candidateId deterministico (sha256 hex 64).
        merchant:
          type: string
        amountMinor:
          type: integer
          description: Monto en minor units COP (pesos x100).
        occurredAt:
          type: string
          format: date-time
        suggestedAccountId:
          type: string
        suggestedCategory:
          type: string
        status:
          type: string
          enum: [pending]
    Warning:
      type: object
      additionalProperties: false
      required:
        - index
        - code
        - message
      properties:
        index:
          type: integer
          description: Indice (0-based) de la transaccion en el array original.
        externalId:
          type: string
          description: externalId del item, si lo tenia.
        code:
          type: string
          enum:
            - duplicate
            - account_not_found
            - invalid_item
            - unsupported_type
        message:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - bad-request
                - unauthorized
                - payload-too-large
            message:
              type: string
